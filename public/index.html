<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Ankit Health Tracker</title><link rel="stylesheet" href="/style.css">
<script src="/app.js" type="module"></script></head>
<body><main>
<header><div><p class="eyebrow">Five-month journey</p><h1>Ankit Health Tracker</h1></div><button id="theme" type="button">Light mode</button></header>
<section id="locked" class="panel"><h2>Open your dashboard</h2><form id="unlock">
<label>Access key <input name="key" type="password" autocomplete="current-password" required></label>
<button>Unlock</button></form></section>
<p id="status" role="status"></p>
<div id="dashboard" hidden>
<section class="panel"><div class="section-head"><div><p class="eyebrow">Egg-free vegetarian</p><h2>Daily meals</h2></div>
<label>Plan date <input id="date" type="date" min="2026-11-04" max="2027-04-03"></label></div><div id="meals"></div></section>
<section class="panel"><p class="eyebrow">Daily check-in</p><h2>Your progress</h2>
<form id="checkin"><div class="fields"><label>Weight (kg) <input name="weight" type="number" min="0.1" max="500" step="0.1" inputmode="decimal"></label>
<label>Activity (minutes) <input name="activity" type="number" min="0" max="1440"></label></div>
<label>Notes <textarea name="notes" maxlength="400" rows="2"></textarea></label>
<button>Save check-in</button></form><p id="trend"></p><ul id="history"></ul></section>
<section class="panel"><p class="eyebrow">Training</p><h2>Society gym</h2><p>Training plan pending the gym equipment video.</p></section>
<button id="lock" type="button">Lock dashboard</button>
</div></main></body></html>
